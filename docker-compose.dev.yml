version: '3.9'

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: "sagittarius"
      POSTGRES_PASSWORD: "sagittarius"
      POSTGRES_DB: "postgres"
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/
      - ./tooling/init-dev-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
  maildev:
    image: maildev/maildev:3.0.0
    ports:
      - "1025:1025"
      - "1080:1080"

volumes:
  database:
