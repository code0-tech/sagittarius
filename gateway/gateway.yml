environment: development

# Default tracing filter. RUST_LOG takes precedence when it is set.
log_level: debug

# OTLP export for logs, traces, and metrics.
# Gateway currently registers no metric instruments; the metrics endpoint is
# present so exporter configuration can be enabled without another config change.
opentelemetry:
  enabled: false
  service_name: gateway
  logs_endpoint:
  metrics_endpoint:
  traces_endpoint:

backend:
  url: "grpc://127.0.0.1:50051"

  # Retry policy for calls to Rails. Only transient errors (Unavailable,
  # DeadlineExceeded, Aborted, ResourceExhausted) are retried.
  retry:
    max_attempts: 3
    initial_backoff_ms: 100
    backoff_multiplier: 2.0

auth:
  jwt_secret: "jwt-secret"
  jwt_ttl_seconds: 300

grpc:
  port: 50051
  host: "127.0.0.1"
  with_health_service: false

# HTTP ingress for file uploads and downloads (#1131). The Proxy terminates the multipart
# upload, size-checks the stream while forwarding it to Rails, which runs authorization,
# computes the checksum and persists the blob via ActiveStorage.
http:
  enabled: true
  port: 8080
  host: "127.0.0.1"

files:
  # Rails endpoint the Proxy forwards the upload to (the old public upload URL).
  rails_upload_url: "http://127.0.0.1:3000/files/upload"
  # Rails endpoint for namespace-scoped storage objects (the FILE data type). Receives the multipart POST
  # of user uploads and the raw, signed PUT of action uploads (query string forwarded).
  rails_storage_upload_url: "http://127.0.0.1:3000/storage_objects/upload"
  # Rails endpoint signed download URLs are resolved against (streamed through the Proxy). Actions reach
  # upload/download through the absolute URLs Rails signs from `rails.file_storage.external_url`.
  rails_storage_download_url: "http://127.0.0.1:3000/storage_objects/download"
  # Per-object size cap enforced while streaming (default 100 MiB). 0 disables the Proxy-side cap.
  max_file_size_bytes: 104857600
